<header>
  <nav class="bg-white border-b border-gray-200">
    <div
      class="max-w-screen-lg flex flex-wrap items-center justify-between mx-auto px-4"
    >
      <a routerLink="/" class="flex items-center space-x-3 rtl:space-x-reverse py-3">
        <svg
          class="h-10 w-auto"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="14 10 320 81"
          style="fill: none"
        >
          <defs>
            <linearGradient id="navNovaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#0D9488"/>
              <stop offset="100%" style="stop-color:#06B6D4"/>
            </linearGradient>
            <linearGradient id="navStarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#06B6D4"/>
              <stop offset="100%" style="stop-color:#0D9488"/>
            </linearGradient>
          </defs>
          <path d="M22 30 C22 22, 28 16, 36 16 L52 16 C60 16, 66 22, 66 30 L66 32 L22 32 Z" fill="url(#navNovaGrad)" opacity="0.3"/>
          <path d="M18 32 L70 32 L66 78 C65.5 84, 60.5 88, 54.5 88 L33.5 88 C27.5 88, 22.5 84, 22 78 Z" fill="url(#navNovaGrad)"/>
          <polygon points="44,38 47,50 60,50 49.5,57 53,69 44,61 35,69 38.5,57 28,50 41,50" fill="#ffffff" opacity="0.95"/>
          <path d="M32 32 L32 24 C32 18, 37 14, 44 14 C51 14, 56 18, 56 24 L56 32" stroke="url(#navNovaGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <text x="82" y="73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
            <tspan fill="#0F172A">Nova</tspan><tspan fill="url(#navNovaGrad)">Mart</tspan>
          </text>
          <line x1="82" y1="82" x2="200" y2="82" stroke="url(#navStarGrad)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </a>
      <div class="flex md:order-2 rtl:space-x-reverse">
        <button
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
        >
          <svg
            fill="currentColor"
            class="size-5"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
          >
            <path
              d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"
            />
          </svg>
        </button>
        <a
          role="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
          routerLink="/cart"
        >
          <svg
            fill="currentColor"
            class="size-5"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 576 512"
          >
            <path
              d="M0 24C0 10.7 10.7 0 24 0L69.5 0c22 0 41.5 12.8 50.6 32l411 0c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3l-288.5 0 5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5L488 336c13.3 0 24 10.7 24 24s-10.7 24-24 24l-288.3 0c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5L24 48C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"
            />
          </svg>
        </a>
        <button
          type="button"
          (click)="toggleMenu()"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
          aria-controls="navbar"
          [attr.aria-expanded]="menuOpen()"
        >
          <span class="sr-only">Open main menu</span>
          <svg
            class="w-5 h-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 17 14"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M1 1h15M1 7h15M1 13h15"
            />
          </svg>
        </button>
      </div>
      <div
        class="items-center justify-between w-full md:flex md:w-auto md:order-1"
        [class.hidden]="!menuOpen()"
        id="navbar"
      >
        <ul
          class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white"
        >
          <li>
            <a
              routerLink="/"
              (click)="menuOpen.set(false)"
              class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-teal-500 md:p-0"
              aria-current="page"
              >Home</a
            >
          </li>
          <li>
            <a
              routerLink="/"
              fragment="products"
              (click)="menuOpen.set(false)"
              class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-teal-500 md:p-0"
              >Products</a
            >
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
