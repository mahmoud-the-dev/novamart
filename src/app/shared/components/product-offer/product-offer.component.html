<div
  class="mx-auto bg-white rounded-md p-6 shadow-md max-w-80 sm:max-w-max sm:pe-32"
>
  <div class="flex flex-col gap-2 sm:max-w-64">
    <h2 class="font-bold text-2xl">{{ product().name }}</h2>
    <p class="text-sm text-gray-500">{{ product().reviews }} reviews</p>
    <div class="flex gap-2 text-2xl font-bold text-gray-900 items-baseline">
      <p>{{ product().price | currency }}</p>
      <del class="text-gray-500 text-base">{{
        product().previousPrice | currency
      }}</del>
    </div>
    <div class="p-2">
      <a
        [routerLink]="['products', product().id]"
        class="inline-flex gap-2 text-gray-500 items-end text-sm hover:underline"
      >
        See More
        <svg
          class="size-4"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 512 512"
        >
          <path
            d="M502.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-128-128c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l370.7 0-73.4 73.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l128-128z"
          />
        </svg>
      </a>
    </div>
  </div>
  <div class="hidden sm:flex absolute top-0 right-0 xl:right-18">
    <img
      class="size-64 object-contain object-center"
      [ngSrc]="optimizedImageUrl(product().urlImg, 256)"
      [alt]="product().name"
      width="256"
      height="256"
      [priority]="priority()"
      [loading]="priority() ? 'eager' : 'lazy'"
    />
    <div
      class="rounded-full absolute top-6 right-8 bg-gradient-to-tl from-yellow-500 to-yellow-300 size-12 inline-flex items-center justify-center"
    >
      <p class="font-bold text-white">{{ discount | percent }}</p>
    </div>
  </div>
</div>
