<a
  [routerLink]="['products', product().id]"
  class="size-full shadow-md bg-white rounded-md border border-gray-300 p-6 flex flex-col items-center mx-auto transition-transform hover:scale-105"
>
  <div class="relative size-24 mb-8 items-center">
      <img
        class="object-contain object-center"
        [ngSrc]="optimizedImageUrl(product().urlImg, 96)"
        [alt]="product().name"
        width="96"
        height="96"
        loading="lazy"
      />
  </div>
  <div class="flex flex-col mt-4 self-start gap-1">
    <h3 class="font-bold text-gray-950 text-base md:text-lg text-pretty">
      {{ product().name }}
    </h3>
    <p class="text-sm text-gray-500">{{ product().reviews }} reviews</p>
    <div class="flex items-baseline gap-1 font-bold">
      <span class="text-gray-950 text-2xl">{{
        product().price | currency
      }}</span>
      @if(product().previousPrice){
      <span class="text-sm line-through text-gray-500">{{
        product().previousPrice | currency
      }}</span>
      }
    </div>
  </div>
</a>
